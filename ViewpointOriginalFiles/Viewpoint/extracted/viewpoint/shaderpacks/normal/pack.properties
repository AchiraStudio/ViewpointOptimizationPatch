name=Vanilla
author=Viewpoint
description=The plain look, as vanilla Minecraft's: each square's light at its corners, smoothed across every face, \
  with a fixed shade per side; a sky that only changes colour; a soft shadow under each character; glowing far \
  lamps. No shadow maps, clouds, volumetric light, bounce light, bloom or puddles.

options=faceShading blobShadows farLamps antialiasing rainDensity

option.faceShading.label=Face shading
option.faceShading.tooltip=How much darker the sides and undersides are than the tops (1: Minecraft's, 0: none).
option.faceShading.range=0 1 0.05
option.faceShading.default=1

option.blobShadows.label=Shadows under characters
option.blobShadows.tooltip=A soft dark patch on the ground under each character and animal.
option.blobShadows.default=true

option.farLamps.label=Far lamps
option.farLamps.tooltip=Street lights and outdoor lamps past the loaded chunks shine as small glowing points at night.
option.farLamps.default=true

option.antialiasing.label=Anti-aliasing (TAA)
option.antialiasing.tooltip=Temporal anti-aliasing: smooth edges, and the dissolves' dither averaged out.
option.antialiasing.default=true
option.antialiasing.preset.potato=false

option.rainDensity.label=Rain density
option.rainDensity.tooltip=How many raindrops, snowflakes and splashes are drawn, against the default. How hard it \n  rains is the game's.
option.rainDensity.values=25 50 75 100 150 200
option.rainDensity.default=100
option.rainDensity.preset.potato=50
option.rainDensity.preset.low=75

pipeline.shadows=false
pipeline.flashlightShadow=false
pipeline.lampShadows=0
pipeline.farShadows=false
pipeline.farLamps=${farLamps}
pipeline.clouds=false
pipeline.volumetrics=false
pipeline.indirect=false
pipeline.bloom=false
pipeline.puddles=false
pipeline.taa=${antialiasing}
pipeline.rainDensity=${rainDensity}
